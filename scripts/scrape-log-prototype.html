<!doctype html>
<!-- THROWAWAY PROTOTYPE: three number-centric scrape-log layouts, switchable with ?variant=A|B|C. -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>刮削日志原型</title>
  <style>
    :root { color-scheme: dark; --bg:#070a0e; --panel:#111820; --line:#24313d; --text:#f1f5f8; --muted:#9bacba; --ok:#78d6b1; --warn:#ffd27a; --bad:#ff9298; --run:#8bbcff; }
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(160deg,#0d1720,var(--bg) 260px);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Microsoft YaHei",sans-serif}
    .app{max-width:800px;margin:auto;min-height:100vh;padding:28px 16px 110px}.eyebrow{color:var(--run);font-size:12px;letter-spacing:.12em}.top{display:flex;justify-content:space-between;align-items:start;margin-bottom:20px}.top h1{font-size:25px;margin:3px 0}.top p{color:var(--muted);margin:0}.summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.chip{border:1px solid var(--line);border-radius:99px;padding:5px 10px;color:var(--muted);font-size:12px}.chip b{color:var(--text)}
    .day{margin:20px 2px 8px;color:var(--muted);font-size:12px}.list{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:rgba(17,24,32,.88)}.item{border-bottom:1px solid var(--line)}.item:last-child{border:0}.row{width:100%;border:0;color:inherit;background:transparent;text-align:left;padding:14px 14px 13px;display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:11px;align-items:center;cursor:pointer}.row:hover{background:#17222d}.rail{height:38px;border-radius:8px;background:var(--status)}.primary{min-width:0}.number{font-weight:750;font-size:16px;letter-spacing:.02em}.meta{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.state{display:flex;align-items:center;gap:8px;color:var(--status);font-weight:700;font-size:12px;text-align:right}.copy{border:1px solid #344552;background:#15212b;color:#d9e5ec;border-radius:6px;padding:4px 7px;font:11px system-ui,sans-serif;cursor:pointer}.copy:hover{border-color:var(--run);color:#fff}.chevron{color:var(--muted);font-size:16px;transition:.18s}.item.open .chevron{transform:rotate(90deg)}.detail{display:none;padding:0 18px 17px 29px}.item.open .detail{display:block}.detail-head{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:1px 0 10px}.flow{border-left:1px solid #334553;margin-left:5px;padding-left:16px}.step{position:relative;padding:0 0 13px}.step:before{content:"";position:absolute;left:-21px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--step,var(--run));box-shadow:0 0 0 4px #16222c}.step:last-child{padding-bottom:0}.step b{font-size:13px}.step span{color:var(--muted);font-size:12px;margin-left:7px}.step p{margin:2px 0 0;color:#c7d2da;font-size:13px}.problem{margin-top:10px;padding:9px 10px;border-radius:8px;background:#3d1c25;color:#ffc6c9;font-size:12px}
    .variant-a .time,.variant-c .time{display:none}
    /* Variant B: table-like dense status board */
    .variant-b .list{border-radius:10px}.variant-b .row{grid-template-columns:8px minmax(0,1fr) auto;padding:12px}.variant-b .time{display:none}.variant-b .rail{height:44px}.variant-b .state{font-size:11px}.variant-b .detail{padding-left:28px}.variant-b .filter{display:flex;gap:8px;margin-bottom:12px}.filter button{background:#16212b;border:1px solid var(--line);color:var(--muted);padding:6px 10px;border-radius:8px}.filter button.active{color:var(--text);border-color:var(--run)}
    /* Variant C: cards, primary status result; no list shell */
    .variant-c .list{background:transparent;border:0;overflow:visible}.variant-c .item{border:1px solid var(--line);background:var(--panel);border-radius:14px;margin-bottom:10px;overflow:hidden}.variant-c .row{grid-template-columns:38px minmax(0,1fr) auto;padding:14px}.variant-c .rail{width:38px;height:38px;border-radius:50%;position:relative}.variant-c .rail:after{content:"✓";color:#06100d;font-weight:900;position:absolute;inset:8px;text-align:center}.variant-c .failed .rail:after{content:"!"}.variant-c .running .rail:after{content:"…"}.variant-c .detail{padding-left:62px}.variant-c .row .state{display:block}
    .facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:0 0 13px}.fact{background:#0c131a;border:1px solid #263541;border-radius:8px;padding:7px 8px}.fact label{display:block;color:var(--muted);font-size:10px;margin-bottom:1px}.fact b{font-size:12px;font-weight:650;word-break:break-word}.section-title{color:#d9e6ee;font-weight:750;font-size:12px;margin:15px 0 7px}.asset-list{display:flex;gap:6px;flex-wrap:wrap}.asset{padding:4px 7px;border-radius:6px;background:#10271f;color:var(--ok);font-size:11px}.asset.warn{background:#362c16;color:var(--warn);font-size:11px}.asset.bad{background:#351b22;color:var(--bad);font-size:11px}.log-stream{border-left:1px solid #2a3945;margin:2px 0 0 6px;padding-left:12px}.log-event{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;padding:0 0 9px;font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace}.log-time{color:#758895}.log-message{color:#c7d2da;white-space:pre-wrap;word-break:break-word}.log-event.bad .log-message{color:var(--bad)}.log-event.warn .log-message{color:var(--warn)}.log-event.ok .log-message{color:var(--ok)}.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:7px;background:#e9f0f5;color:#091016;border-radius:999px;box-shadow:0 10px 34px #0008}.switcher button{border:0;background:#c9d5de;width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer}.switcher .label{min-width:150px;text-align:center;font-weight:700;font-size:12px}.hint{color:var(--muted);font-size:12px;text-align:center;margin-top:18px}
    @media(max-width:460px){.app{padding:20px 12px 108px}.row{padding:12px 10px;gap:9px}.detail{padding-left:22px}.variant-b .row{grid-template-columns:48px 6px minmax(0,1fr) 52px}.variant-b .detail{padding-left:69px}.summary{gap:6px}}
  </style>
</head>
<body>
  <main class="app" id="app">
    <div class="top"><div><div class="eyebrow">THROWAWAY UI PROTOTYPE</div><h1>刮削记录</h1><p>以番号为单位；点击一行查看完整流程。</p></div><div class="chip">今日 <b>18</b> 条</div></div>
    <div class="summary"><span class="chip"><b style="color:var(--ok)">12</b> 成功</span><span class="chip"><b style="color:var(--bad)">3</b> 失败</span><span class="chip"><b style="color:var(--warn)">2</b> 警告</span><span class="chip"><b style="color:var(--run)">1</b> 进行中</span></div>
    <div id="variant"></div>
    <p class="hint">点击任意番号行展开／收起；底部切换三种结构方案。</p>
  </main>
  <nav class="switcher"><button id="prev" aria-label="上一个方案">‹</button><div class="label" id="label"></div><button id="next" aria-label="下一个方案">›</button></nav>
  <script>
    const data=[
      {number:'IPZZ-913',time:'20:10:52',end:'20:11:15',status:'成功',cls:'ok',logs:[['20:10:52','网盘添加已持久化加入队列：IPZZ-913.mp4',''],['20:10:52','开始处理持久化网盘任务：IPZZ-913.mp4',''],['20:10:52','STRM 写入完成，开始扫描单个 STRM：IPZZ-913.strm',''],['20:10:53','[任务] 原文件=IPZZ-913.mp4，提取番号=IPZZ-913，来源=优先级刮削','ok'],['20:10:53','优先级刮削尝试 1/3：DMM2，检索词=ipzz00913',''],['20:10:56','DMM2 搜索返回：0 条','bad'],['20:10:56','刮削来源 DMM2 第 1/1 次失败：未搜索到匹配影片','bad'],['20:10:56','优先级刮削尝试 2/3：TheJavDB，检索词=IPZZ-913',''],['20:11:02','优先级刮削成功：TheJavDB，已获得元数据','ok'],['20:11:02','创建演员目录：波多野结衣',''],['20:11:02','创建影片目录：【文学少女】IPZZ-913',''],['20:11:02','新 STRM 已写入：IPZZ-913.strm','ok'],['20:11:02','开始写入 NFO：IPZZ-913.nfo',''],['20:11:03','NFO 写入完成：IPZZ-913.nfo','ok'],['20:11:03','开始下载海报（候选 1/1）',''],['20:11:09','海报写入完成：IPZZ-913-poster.jpg','ok'],['20:11:09','开始下载缩略图（候选 1/1）',''],['20:11:12','缩略图写入完成：IPZZ-913-thumb.jpg','ok'],['20:11:12','缩略图复制为背景图：IPZZ-913-fanart.jpg','warn'],['20:11:13','背景图写入完成：IPZZ-913-fanart.jpg','ok'],['20:11:14','旧 STRM 已删除；开始同步影片数据库',''],['20:11:15','影片表与 STRM 索引表已同步，movieId=11443','ok'],['20:11:15','持久化网盘任务完成：IPZZ-913','ok']]},
      {number:'ABW-412',time:'14:25:19',end:'14:25:34',status:'失败',cls:'failed',logs:[['14:25:19','[任务] 原文件=ABW-412.strm，提取番号=ABW-412，来源=优先级刮削','ok'],['14:25:19','优先级刮削尝试 1/2：DMM2，检索词=abw00412',''],['14:25:24','刮削来源 DMM2 第 1/3 次失败：请求超时；2 秒后重试','bad'],['14:25:28','刮削来源 DMM2 第 2/3 次失败：请求超时；2 秒后重试','bad'],['14:25:31','刮削来源 DMM2 第 3/3 次失败：请求超时','bad'],['14:25:31','优先级刮削失败：DMM2；开始回退到 JavBus','bad'],['14:25:31','优先级刮削尝试 2/2：JavBus，检索词=ABW-412',''],['14:25:34','JavBus 搜索返回：0 条','bad'],['14:25:34','优先级刮削全部失败；未写入 STRM、NFO 或图片；数据库未变更','bad']]},
      {number:'IPX-987',time:'14:20:07',end:'14:20:15',status:'警告',cls:'warn',logs:[['14:20:07','[任务] 原文件=IPX-987.strm，提取番号=IPX-987，来源=优先级刮削','ok'],['14:20:08','DMM2 获取元数据成功','ok'],['14:20:10','NFO 写入完成：IPX-987.nfo','ok'],['14:20:13','海报、缩略图、背景图写入完成','ok'],['14:20:14','演员头像下载失败：演员 A；已加入后台补齐队列','warn'],['14:20:15','数据库同步完成，movieId=11441','ok']]},
      {number:'JUL-710',time:'14:19:52',end:'—',status:'进行中',cls:'running',logs:[['14:19:52','[任务] 原文件=JUL-710-HD.strm，提取番号=JUL-710','ok'],['14:19:53','JavBus 获取元数据成功','ok'],['14:19:55','NFO 写入完成：JUL-710.nfo','ok'],['14:19:56','开始下载海报（候选 1/3）','warn']]}
    ];
    const variants=[['A','紧凑列表'],['B','状态看板'],['C','结果卡片']];let current=new URLSearchParams(location.search).get('variant')||'A';
    function item(x,i,variant){const status=x.cls==='ok'?'var(--ok)':x.cls==='failed'?'var(--bad)':x.cls==='warn'?'var(--warn)':'var(--run)';const type=x.cls==='failed'?'failed':x.cls==='running'?'running':'';const stream=x.logs.map(l=>`<div class="log-event ${l[2]||''}"><span class="log-time">${l[0]}</span><span class="log-message">${l[1]}</span></div>`).join('');return `<article class="item ${type}" style="--status:${status}"><div class="row" role="button" tabindex="0" onclick="this.closest('.item').classList.toggle('open')"><span class="rail"></span><span class="primary"><span class="number">${x.number}</span></span><span class="state"><button class="copy" onclick="copyLogs(event,${i})">复制</button><span class="chevron">›</span></span></div><div class="detail"><div class="detail-head"><span>完整日志</span></div><div class="log-stream">${stream}</div></div></article>`}
    async function copyLogs(event,index){event.stopPropagation();const text=data[index].logs.map(line=>`[${line[0]}] ${line[1]}`).join('\n');const button=event.currentTarget;try{if(navigator.clipboard)await navigator.clipboard.writeText(text);else throw new Error('clipboard unavailable')}catch{const area=document.createElement('textarea');area.value=text;document.body.appendChild(area);area.select();document.execCommand('copy');area.remove()}const original=button.textContent;button.textContent='已复制';setTimeout(()=>button.textContent=original,1200)}
    function render(){const root=document.getElementById('app');root.className=`app variant-${current.toLowerCase()}`;const extra=current==='B'?`<div class="filter"><button class="active">全部 18</button><button>失败 3</button><button>警告 2</button></div>`:'';document.getElementById('variant').innerHTML=`${extra}<div class="day">今天 · 2026-08-11</div><section class="list">${data.map((x,i)=>item(x,i,current)).join('')}</section>`;document.getElementById('label').textContent=`方案 ${current} · ${variants.find(x=>x[0]===current)[1]}`;history.replaceState(null,'',`?variant=${current}`)}
    function shift(n){let i=variants.findIndex(x=>x[0]===current);current=variants[(i+n+variants.length)%variants.length][0];render()}document.getElementById('prev').onclick=()=>shift(-1);document.getElementById('next').onclick=()=>shift(1);document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft')shift(-1);if(e.key==='ArrowRight')shift(1)});render();
  </script>
</body>
</html>
